<!doctype html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>VIBE - TTS</title>
    <!-- Include Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #333;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #4ca6a6 0%, #333 60%);
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .logo span {
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 16px;
        }

        .center-content {
            text-align: center;
        }

        .question {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
        }

        .input-box {
            width: 500px;
            max-width: 90%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #aaa;
            color: black;
            font-size: 18px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            resize: none;
            overflow: hidden;
        }

        .audio-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ff6666;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .audio-button:hover {
            background-color: #ff4d4d;
        }

        .audio-button i {
            font-size: 20px;
            color: white;
        }

        .response {
            margin-top: 20px;
            font-size: 16px;
            color: #ffcccc;
        }

        #loading-indicator {
            display: none;
            color: #ffcc00;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <a href="{{ url_for('main.index') }}" class="logo">
        <div style="font-size: 24px;">S</div>
        <span>VIBE - TTS</span>
    </a>

    <div class="center-content">
        <div class="question">Mitä voin auttaa?</div>
        <div class="input-container">
            <textarea class="input-box" placeholder="kysy mitä haluat"></textarea>
            <button class="audio-button" id="audio-button">
                <i class="bi bi-mic-fill"></i>
            </button>
        </div>
        <div id="loading-indicator">Luodaan ääntä...</div> <!-- Loading Indicator -->
        <div class="response">
            <p id="response-text"></p>
        </div>
    </div>

    <script>
        const inputBox = document.querySelector('.input-box');
        const responseText = document.getElementById('response-text');
        const audioButton = document.getElementById('audio-button');
        const loadingIndicator = document.getElementById('loading-indicator');

        inputBox.addEventListener('input', function () {
            inputBox.style.height = 'auto';
            inputBox.style.height = inputBox.scrollHeight + 'px';
        });

        inputBox.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                triggerTTS();
            }
        });

        inputBox.addEventListener('drop', function (e) {
            e.preventDefault();
            responseText.textContent = "Virhe: Kuvia ei voi pudottaa tähän.";
        });

        audioButton.addEventListener('click', function () {
            triggerTTS();
        });

        function triggerTTS() {
            const userInput = inputBox.value;
            if (userInput.trim() === "") {
                responseText.textContent = "Virhe: Tekstiä ei voi olla tyhjä.";
                return;
            }

            loadingIndicator.style.display = 'block'; // Show loading indicator

            fetch('http://localhost:5000/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input_text: userInput })
            })
                .then(response => response.blob())
                .then(blob => {
                    const audioUrl = URL.createObjectURL(blob);
                    const audio = new Audio(audioUrl);

                    audio.addEventListener('canplaythrough', () => {
                        audio.play().catch(err => {
                            console.error("Playback error:", err);
                            responseText.textContent = "Äänen toisto epäonnistui.";
                        });
                        loadingIndicator.style.display = 'none'; // Hide loading indicator
                    });
                })
                .catch(err => {
                    console.error("TTS API error:", err);
                    responseText.textContent = "TTS-ääni epäonnistui.";
                    loadingIndicator.style.display = 'none'; // Hide loading indicator
                });
        }
    </script>
</body>

</html>
