<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>VIBE - SLT | Error</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #a64ca6 0%, #333 60%);
            font-family: 'Arial', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo div {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 120px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="logo">
        <div>VIBE</div>
        <span>SLT</span>
    </div>

    <div class="content">
        <h1>Error</h1>
        <p>Something went wrong. Please try again later.</p>
    </div>
    <script>
        // Optional: Add any JavaScript functionality here
        // For example, you can redirect to the home page after a few seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 5000); // Redirect after 5 seconds
    </script>
</body>

</html>
