<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>VIBE - SLT</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #a9a9a9;
        }

        .header {
            background: linear-gradient(to right, #2b2b2b, #4b004b);
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .header span {
            background-color: #e74c3c;
            padding: 4px 8px;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 16px;
        }

        .logo {
            text-decoration: none;
            color: inherit;
        }

        .chat-container {
            position: absolute;
            top: 50px;
            /* below header */
            bottom: 80px;
            /* above input field */
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .user-message,
        .bot-message {
            max-width: 60%;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #4b4b4b;
            align-self: flex-start;
        }

        .bot-message {
            background-color: #7e5a9b;
            align-self: flex-end;
            position: relative;
        }

        .bot-icon {
            position: absolute;
            left: -30px;
            top: 0;
            font-size: 24px;
        }

        .input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #4b4b4b;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
        }

        .user-input {
            flex: 1;
            border: none;
            background-color: #4b4b4b;
            color: white;
            font-size: 16px;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        .user-input::placeholder {
            color: #ccc;
        }

        .user-input:focus {
            background-color: #5a5a5a;
        }

        .mic-icon {
            font-size: 24px;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <a href="{{ url_for('main.index') }}" class="logo">
        <div class="header"><span>VIBE - SLT</span></div>
    </a>

    <div class="chat-container" id="chat">
        <!-- Messages will be dynamically added here -->
    </div>

    <div class="input-container">
        <input type="text" class="user-input" placeholder="Kirjoita viestisi tähän..." />
        <span class="mic-icon">🎤</span>
    </div>

    <script>
        const inputField = document.querySelector('.user-input');
        const chatContainer = document.getElementById('chat');

        inputField.addEventListener('keypress', async function (e) {
            if (e.key === 'Enter' && inputField.value.trim() !== "") {
                const userText = inputField.value.trim();

                const userMessage = document.createElement('div');
                userMessage.className = 'user-message';
                userMessage.textContent = userText;
                chatContainer.appendChild(userMessage);
                inputField.value = '';

                chatContainer.scrollTop = chatContainer.scrollHeight;

                const params = new URLSearchParams(window.location.search);
                const service = params.get('intent') ? 'intent' : 'text';

                try {
                    const endpoint = service === 'intent' ? '/api/intent' : '/api/text';

                    const response = await fetch(`http://localhost:5000${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ input_text: userText })
                    });

                    const data = await response.json();

                    const botMessage = document.createElement('div');
                    botMessage.className = 'bot-message';
                    botMessage.innerHTML = `<span class="bot-icon"><i class="bi bi-robot"></i></span> ${data.response || "En saanut vastausta palvelimelta."}`;
                    chatContainer.appendChild(botMessage);

                    chatContainer.scrollTop = chatContainer.scrollHeight;

                } catch (error) {
                    console.error('Error:', error);
                }
            }
        });

        // When the page loads, check the URL parameters for 'question'
        document.addEventListener('DOMContentLoaded', async function () {
            const params = new URLSearchParams(window.location.search);
            const question = params.get('question');
            const service = params.get('intent') ? 'intent' : 'text';

            if (question) {
                // Display the user question in the chat container
                const userMessage = document.createElement('div');
                userMessage.className = 'user-message';
                userMessage.textContent = decodeURIComponent(question); // Decode URL-encoded question
                chatContainer.appendChild(userMessage);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                try {
                    // Make a request to the appropriate service (intent or text generation)
                    const endpoint = service === 'intent' ? '/api/intent' : '/api/text';

                    const response = await fetch(`http://localhost:5000${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ input_text: decodeURIComponent(question) })
                    });

                    const data = await response.json();

                    const botMessage = document.createElement('div');
                    botMessage.className = 'bot-message';
                    botMessage.innerHTML = `<span class="bot-icon"><i class="bi bi-robot"></i></span> ${data.response || "En saanut vastausta palvelimelta."}`;
                    chatContainer.appendChild(botMessage);

                    chatContainer.scrollTop = chatContainer.scrollHeight;

                } catch (error) {
                    console.error('Error:', error);
                }
            }
        });
    </script>

</body>

</html>
