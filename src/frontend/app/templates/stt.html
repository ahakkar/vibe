<!doctype html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>VIBE - STT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Add your styles as needed */
        body {
            margin: 0;
            padding: 0;
            background: #333;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #4ca6a6 0%, #333 60%);
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .logo span {
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 16px;
        }

        .center-content {
            text-align: center;
        }

        .question {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
        }

        .audio-button {
            position: relative;
            background-color: #ff6666;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .audio-button:hover {
            background-color: #ff4d4d;
        }

        .audio-button i {
            font-size: 24px;
            color: white;
        }

        #loading-indicator {
            display: none;
            color: #ffcc00;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <a href="{{ url_for('main.index') }}" class="logo">
        <div style="font-size: 24px;">S</div>
        <span>VIBE - STT</span>
    </a>

    <div class="center-content">
        <div class="question">Paina mikrofonia ja puhu</div>
        <div class="input-container">
            <button class="audio-button" id="mic-button">
                <i class="bi bi-mic-fill" id="mic-icon"></i>
            </button>
        </div>
        <div id="loading-indicator">Luodaan ääntä...</div>
    </div>

    <script>
        const micButton = document.getElementById('mic-button');
        const micIcon = document.getElementById('mic-icon');
        const loadingIndicator = document.getElementById('loading-indicator');

        let isRecording = false; // State to track if recording is in progress
        let mediaRecorder;
        let audioChunks = [];

        micButton.addEventListener('click', async () => {
            if (!isRecording) {
                // Start recording
                isRecording = true;
                micIcon.classList.remove('bi-mic-fill');
                micIcon.classList.add('bi-stop-fill');
                loadingIndicator.style.display = 'block';
                audioChunks = []

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                    // Collect audio chunks
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    // Start recording
                    mediaRecorder.start();
                } catch (err) {
                    console.error('Error accessing microphone:', err);
                    alert('Virhe: Mikrofonia ei voitu käyttää.');
                    resetRecordingState();
                }
            } else {
                // Stop recording
                isRecording = false;
                micIcon.classList.remove('bi-stop-fill');
                micIcon.classList.add('bi-mic-fill');
                loadingIndicator.style.display = 'block';

                mediaRecorder.stop();

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    console.log("Audio Blob:", audioBlob);

                    const wavBlob = await convertToWav(audioBlob);

                    // Create FormData and append the audio blob
                    const formData = new FormData();
                    formData.append('audio', wavBlob, 'recording.webm');

                    // Send the audio to the backend (GET request)
                    try {
                        const response = await fetch('http://localhost:5000/api/stt', {
                            method: 'POST',
                            body: formData
                        }); // GET request now

                        const data = await response.json();
                        console.log("Backend Response:", data);

                        const question = data.response || "Something went wrong.";

                        // Redirect to /stt/chat with the transcription as a query parameter
                        window.location.href = `/stt/chat?question=${encodeURIComponent(question)}`;
                    } catch {
                        console.log("error")
                    }
                };
            }
        });

        // Simplified WAV converter
        async function convertToWav(blob) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await blob.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            const wavBytes = getWavBytes(audioBuffer);
            return new Blob([wavBytes], { type: 'audio/wav' });
        }

        function getWavBytes(audioBuffer) {
            const numChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const bytesPerSample = 2;
            const blockAlign = numChannels * bytesPerSample;

            // WAV header (44 bytes)
            const buffer = new ArrayBuffer(44 + audioBuffer.length * blockAlign);
            const view = new DataView(buffer);

            // RIFF header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + audioBuffer.length * blockAlign, true);
            writeString(view, 8, 'WAVE');
            // fmt chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // chunk size
            view.setUint16(20, 1, true); // PCM format
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bytesPerSample * 8, true);
            // data chunk
            writeString(view, 36, 'data');
            view.setUint32(40, audioBuffer.length * blockAlign, true);

            // Write PCM data
            const writeAudio = (channelData, offset) => {
                for (let i = 0; i < channelData.length; i++, offset += 2) {
                    const s = Math.max(-1, Math.min(1, channelData[i]));
                    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                }
            };

            for (let channel = 0; channel < numChannels; channel++) {
                writeAudio(audioBuffer.getChannelData(channel), 44 + channel * bytesPerSample);
            }

            return buffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function resetRecordingState() {
            isRecording = false;
            micIcon.classList.remove('bi-stop-fill');
            micIcon.classList.add('bi-mic-fill');
            loadingIndicator.style.display = 'none';
            audioChunks = []; // Clear audio chunks for the next recording
        }
    </script>
</body>

</html>
