# https://developers.home-assistant.io/docs/voice/intent-recognition/template-sentence-syntax
language: "fi"
intents:
  GetNews:
    data:
      - sentences:
          - "kerro [tämän] päivän uutiset"
          - "(kerro | lue) uutiset"
          - "(kerro | lue) [uutiset] (kotimaasta | ulkomaista | taloudesta | urheilusta)"
          - "(kerro | lue) [uutiset] [aiheesta] (pääuutiset | kotimaa | ulkomaat | talous | urheilu)"
          - "(kerro | lue) [(lisää | uutinen)] {aihe}"
  GetCurrentWeather:
    data:
      - sentences:
          - "(mikä | mitä) sää on tänään"
  GetTime:
    data:
      - sentences:
          - "(kuinka paljon | paljonko | mitä) kello on"
skip_words:
  - "kiitos"

lists:
  aihe:
    wildcard: true
  