# https://developers.home-assistant.io/docs/voice/intent-recognition/template-sentence-syntax
language: "fi"
intents:
  GetNews:
    data:
      - sentences:
          - "kerro [tämän] päivän uutiset"
          - "(kerro | lue) [(lisää | uutinen | uutiset)] [aiheesta] {aihe}"
  #Default location tampere
  GetCurrentWeather:
    data:
      - sentences:
          - "millainen sää on [nyt]"

  GetCurrentWeatherAtLocation:
    data:
      - sentences:
          - "millainen sää on nyt [paikassa] {sijainti}"

  #Default location tampere
  GetForecast:
    data:
      - sentences:
          - "millainen sää on {aika}"

  GetForecastAtLocation:
    data:
      - sentences:
        - "millainen sää on {aika} [paikassa] {sijainti}"
  
  GetTime:
    data:
      - sentences:
          - "(kuinka paljon | paljonko | mitä) kello on"
skip_words:
  - "kiitos"

lists:
  aihe:
    wildcard: true
  aika:
    values:
    #Tänään does not work for some reason in IR
      - "tänään"
      - "huomenna"
      - "ylihuomenna"
    #Tällä viikolla gets just next 7 days' forecast
      - "tällä viikolla"
  sijainti:
    wildcard: true
  