# https://developers.home-assistant.io/docs/voice/intent-recognition/template-sentence-syntax
language: "fi"
intents:
  GetNews:
    data:
      - sentences:
          - "kerro [tämän] päivän uutiset"
          - "(kerro | lue) uutiset"
          - "(kerro | lue) [uutiset] (kotimaasta | ulkomaista | taloudesta | urheilusta)"
          - "(kerro | lue) [uutiset] [aiheesta] (pääuutiset | kotimaa | ulkomaat | talous | urheilu)"
          - "(kerro | lue) [(lisää | uutinen)] {aihe}"
  #Default location tampere
  GetCurrentWeather:
    data:
      - sentences:
          - "(mikä | mitä | millainen) sää on nyt"

  #Default location tampere
  GetForecast:
    data:
      - sentences:
          - "(kerro | millainen) sää [on] {aika}"

  GetForecastAtLocation:
    data:
      - sentences:
        - "(kerro | millainen) sää [on] {aika} [paikassa] {sijainti}"
  
  GetTime:
    data:
      - sentences:
          - "(kuinka paljon | paljonko | mitä) kello on"
skip_words:
  - "kiitos"

lists:
  aihe:
    wildcard: true
  aika:
    values:
    #Tänään does not work for some reason in IR
      - "tänään"
      - "huomenna"
      - "ylihuomenna"
  sijainti:
    wildcard: true
  