<!doctype html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>VIBE - SLT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #333;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #a64ca6 0%, #333 60%);
        }

        .chat-background {
            background-color: #353e32;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-direction: column;
            height: 85%;
            width: 60%;
        }

        .chat-input {
            display: flex;
            align-items: flex-end;
            padding-top: 20px;
            margin-bottom: 10px;
        }

        #chat-messages {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            overflow-y: auto;
            width: 100%;
            padding: 20px;
            gap: 10px;
            flex-grow: 1;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo span {
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 16px;
        }

        .center-content {
            text-align: center;
        }

        .question {
            font-size: 28px;
            margin-top: 20px;
        }

        .input-box {
            width: 500px;
            max-width: 90%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #aaa;
            color: black;
            font-size: 18px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .button1 {
            width: 50px;
            max-width: 90%;
            padding: 15px;
            border-radius: 10px;
            background-color: #aaa;
            color: black;
            font-size: 18px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .user-message {
            width: 200px;
            max-width: 90%;
            padding: 15px;
            border-radius: 10px;
            background-color: #aaa;
            color: black;
            font-size: 18px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            text-align: right;
            align-self: flex-end;
            margin-right: 80px;
        }

        .bot-message {
            width: 200px;
            max-width: 90%;
            padding: 15px;
            border-radius: 10px;
            background-color: #aaa;
            color: black;
            font-size: 18px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            text-align: left;
            align-self: flex-start;
            margin-left: 80px;
        }
    </style>
</head>

<body>
    <a href="{{ url_for('main.index') }}" style="text-decoration: none; color: inherit;">
        <div class="logo">
            <div style="font-size: 24px;">S</div>
            <span>VIBE - SLT</span>
        </div>
    </a>
    <div class="chat-background">
        <div id="chat-messages">
            <p class="user-message">Moi</p>
            <p class="bot-message">Moi</p>
            <p class="user-message">Mitä kuuluu?</p>
            <p class="bot-message">Hyvää</p>
        </div>
        <div class="chat-input">
            <input type="text" class="input-box" id="user-message" placeholder="kysy mitä haluat" />
            <button onclick="sendMessage()" class="button1">></button>
        </div>
    </div>

    <script>

        function sendMessage() {
            const userMessage = document.getElementById('user-message').value
            const chatMessages = document.getElementById('chat-messages');

            chatMessages.innerHTML += `<p class="user-message">${userMessage}</p>`;
