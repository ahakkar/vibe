<!doctype html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>VIBE - SLT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #333;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #a64ca6 0%, #333 60%);
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo span {
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 16px;
        }

        .center-content {
            text-align: center;
        }

        .question {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .input-box {
            width: 500px;
            max-width: 90%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #aaa;
            color: black;
            font-size: 18px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <a href="{{ url_for('main.index') }}" style="text-decoration: none; color: inherit;">
        <div class="logo">
            <div style="font-size: 24px;">S</div>
            <span>VIBE - SLT</span>
        </div>
    </a>

    <a href="{{ url_for('chat.chat_page') }}" style="text-decoration: none; color: inherit;">
        <div class="center-content">
            <div class="question">Mitä voin auttaa?</div>
            <input type="text" class="input-box" placeholder="kysy mitä haluat" />
        </div>
    </a>
</body>

</html>
