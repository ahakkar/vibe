services:
  app:
    build: ./backend/service1/src
    image: vibe-app-image:latest # Specify the custom image name and tag
    container_name: my_python_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - ./models:/models
    environment:
      - PYTHONUNBUFFERED=1 # Disable output buffering
      - RUNNING_IN_DOCKER=true # Indicate that the code is running inside Docker
    stdin_open: true  # Keep the standard input open
    tty: true         # Allocate a pseudo-TTY
    privileged: true
    devices:
      - /dev/snd:/dev/snd # Add access to the host's sound devices
      - /dev/input:/dev/input # Add access to the host's input devices